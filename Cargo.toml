[package]
name = "lyric_finder"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A lyric finder library"
authors = [
  "Thang Pham <phamducthang1234@gmail.com>",
  "Cycle Five <cycle.five@proton.me>",
]
repository = "https://github.com/cycle-five/lyric-finder"
readme = "README.md"
keywords = ["lyric", "lyrics", "song", "track", "genius"]
categories = ["api-bindings", "multimedia::audio"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Kept so downstream crates using the old feature name keep compiling.
rustls-tls = ["rustls"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query", "http2", "charset"], default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
log = "0.4"

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "macros"] }
env_logger = { version = "0.11", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[[example]]
name = "lyric-finder"
path = "examples/lyric-finder.rs"
